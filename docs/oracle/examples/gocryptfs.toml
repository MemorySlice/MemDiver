# Config for the bundled gocryptfs oracle (gocryptfs.py).
#
# `sample_ciphertext` must name a file encrypted by the SAME gocryptfs
# instance whose master key you are recovering from memory — any encrypted
# content file under that vault's cipher/ dir will do. Each 32-byte key
# candidate derives a content key via HKDF-SHA256 and is verified by
# AES-GCM-decrypting block 0 of this file, so a ciphertext from a different
# vault (a different password, hence a different master key) fails for every
# candidate: zero hits, no error, and no hint as to why.
#
# You usually do not have to fill this in. When the dumps you selected belong
# to a dataset whose meta.json declares `vault_cipher_dir`, MemDiver derives
# the path from the first selected dump's run and prefills it for you; the
# value below is only the shape of the answer, not a path that exists.
#
# gocryptfs.conf and gocryptfs.diriv are vault metadata, not content, so they
# are excluded from that search.
#
# Cipher note: this oracle hardcodes AES-256-GCM. An `xchacha` run cannot be
# verified by it at all — every candidate raises InvalidTag, which is
# indistinguishable from "the key is not in this dump". MemDiver refuses to
# prefill for such a run rather than hand you a config that is guaranteed to
# lie; use an aes run, or an oracle that speaks xchacha.
sample_ciphertext = "/absolute/path/to/your/gocryptfs/vault/cipher/<any-encrypted-file>"

# Everything under [memdiver] is MemDiver's own automation metadata, not the
# oracle's config: it is stripped before the template reaches build_oracle(),
# so an oracle can never see — or collide with — these keys.
[memdiver]
requires_cipher = "aes"

[memdiver.autofill.sample_ciphertext]
strategy = "vault_content_file"
exclude = ["gocryptfs.conf", "gocryptfs.diriv"]
