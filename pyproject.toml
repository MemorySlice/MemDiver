[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memdiver"
version = "0.8.8"
description = "Interactive platform for identifying and analyzing data structures in memory dumps"
readme = "README.md"
license = {text = "Apache 2.0"}
requires-python = ">=3.11"
authors = [
    {name = "MemorySlice contributors"},
]
keywords = [
    "memory-analysis",
    "forensics",
    "cryptography",
    "tls",
    "security",
    "binary-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]
# Base deps = the FULL install. `pip install memdiver` is deliberately the
# complete product: the importable library core (`import memdiver`, `open_dump`,
# `MslReader`/`MslWriter`, `import_dump`, `run_auto_floor`, `detect_format`),
# the analysis/CLI stack, AND every primary interface -- HTTP API + web UI, MCP
# server, and the pcap verification oracle.
#
# This reverses the pre-0.6 "O-4" split. Rationale: the three interfaces cost
# only ~37 MB on top of the core, and someone who types `memdiver web` should
# not first have to discover an extra. Marimo is the sole exception and stays
# opt-in -- it alone costs ~164 MB, more than four times every other interface
# combined, and `memdiver ui` is the least-central surface.
#
# Dump collection (frida-tools + memslicer) and the post-quantum KEM paths
# (liboqs-python) are in base too. Note what that does and does NOT buy: pip
# resolves all three fine, but each needs a NATIVE runtime piece that pip cannot
# provide -- liboqs-python DOWNLOADS AND CMAKE-BUILDS the liboqs C library into
# ~/_oqs on first `import oqs` (so it needs cmake + a compiler), frida needs an
# attachable target, and the LLDB backend comes from the OS. Those paths
# therefore report a NATIVE-dependency error, never a `pip install ...[extra]`
# hint -- see msl/crypto.py and app/experiment_orchestration.py.
#
# The lazy imports and "install the X extra" hints throughout the codebase are
# retained on purpose: they still fire correctly for [marimo]/[crypto]/
# [experiment], and for anyone who force-uninstalls a base dependency.
dependencies = [
    "plotly>=5.18.0",
    "polars>=1.0.0",
    "duckdb>=1.0.0",
    "ibis-framework[duckdb]>=9.0.0",
    "blake3",
    "zstandard",
    "lz4",
    "pyahocorasick>=2.0.0",
    "numpy>=1.24.0",
    "kaitaistruct>=0.10",
    # MSL container AEAD encryption (spec §10). cryptography: AES-256-GCM,
    # X25519, HKDF. PyNaCl: XChaCha20-Poly1305 (24-byte nonce, not in
    # cryptography's high-level AEAD API). argon2-cffi: Argon2id KDF for
    # passphrase-derived keys. Kept as base deps so `pip install memdiver`
    # yields a working encrypt/decrypt path out of the box.
    "cryptography>=42.0",
    "PyNaCl>=1.5",
    "argon2-cffi>=23.0",
    # --- HTTP API + web UI backend (`memdiver web`) ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    # REQUIRED, not optional: four routers (dumps, consensus, oracles, pcaps)
    # declare `UploadFile = File(...)` / `Form(...)`, and FastAPI raises
    # RuntimeError("Form data requires \"python-multipart\"") at ROUTER IMPORT
    # time -- so without it `memdiver web` crashes on startup, it does not merely
    # fail on upload. Neither `fastapi` nor `uvicorn[standard]` pulls it in (only
    # `fastapi[standard]` does). Pinned to match fastapi's own `standard` extra.
    "python-multipart>=0.0.18",
    # --- MCP server for AI-agent integration (`memdiver mcp`) ---
    "mcp>=1.0.0",
    # --- pcap/pcapng parsing for the TLS decryption-challenge oracle
    #     (`TlsPcapResource`): prove a memory-recovered key decrypts real
    #     captured records. ---
    "dpkt>=1.9.8",
    # --- YARA rule compilation + scanning for detector evaluation
    #     (engine/yara_scan.py): compile a MemDiver-emitted pattern rule and
    #     measure it against the corpus. Base, not an extra: an emitted detector
    #     you cannot scan with is a detector you cannot evaluate. ---
    # DO NOT "fix" the 1024-byte regexp scan limit by raising this floor: the
    # version that fixes it does not exist. `YR_RE_SCAN_LIMIT` regressed
    # 4096 -> 1024 in libyara 4.5.3/4.5.4 (upstream PR #2144), which makes any
    # wildcard pattern wider than 1024 bytes match NOTHING, silently. The
    # upstream revert is UNRELEASED: as verified against the PyPI JSON API,
    # 4.5.4 is the newest published sdist/wheel and there is no 4.5.5 (4.5.3
    # was never published either -- the releases jump 4.5.2 -> 4.5.4). The
    # limit is also not raisable at runtime: `yara.set_config` exposes
    # stack_size / max_strings_per_rule / max_match_data and not the scan
    # limit. It is therefore handled in CODE, by probing libyara for the real
    # limit and refusing to call an unverifiable rule "clean" --
    # `engine.yara_scan.regexp_scan_limit` and
    # `tests/test_libyara_scan_limit.py`. When a fixed release does land, the
    # probe self-corrects and no floor change is needed for correctness.
    "yara-python>=4.5.4",
    # --- Dump collection (`memdiver experiment`). Needs a live, attachable
    #     target at runtime; the LLDB backend is installed via the OS (Xcode
    #     Command Line Tools on macOS, `apt install lldb` on Debian/Ubuntu). ---
    "frida-tools>=12.0",
    "memslicer",
    # --- Post-quantum KEM for MSL encryption (spec 10.4: ML-KEM-768/1024 and
    #     the X25519+ML-KEM-768 hybrid). liboqs-python builds the liboqs C
    #     library into ~/_oqs on FIRST IMPORT, which needs cmake + a compiler --
    #     so a successful pip install does not by itself guarantee ML-KEM works.
    #     The probe in msl/crypto.py degrades cleanly when the build fails. ---
    "liboqs-python>=0.10",
]

[project.optional-dependencies]
# BACK-COMPAT ALIASES, intentionally empty. api/mcp/pcap are part of the base
# install now, so `pip install "memdiver[api]"` resolves to exactly the same
# thing as `pip install memdiver` -- but it still RESOLVES, so every existing
# README, Dockerfile, CI script and requirements.txt in the wild keeps working
# instead of failing on an unknown extra. Do not delete these.
#
# Note that Python extras can only ever ADD dependencies, never subtract them.
# Now that the base install is the full product, there is by design no install
# smaller than the default; a genuinely lean variant would have to be a separate
# distribution on PyPI.
api = []
mcp = []
pcap = []
experiment = []
crypto = []
# The one interface that is still opt-in: Marimo pulls ~164 MB, more than four
# times every other interface combined.
marimo = ["marimo>=0.8.0"]
# Volatility3, for running (not merely emitting) the plugins the architect
# layer generates -- engine/vol3_verify.py loads an emitted plugin and executes
# it against a real framework, and engine/vol3_subproc.py drives a foreign
# `vol` launcher out-of-process.
#
# Floor 2.27: the module-name + callable-filter `PsList` signatures
# (`linux.pslist.PsList.list_tasks`, `windows.pslist.PsList.list_processes`)
# that the emitted template's PID path relies on are stable from there.
# Capped below 3.0: the emitted plugin declares
# `_required_framework_version = (2, 0, 0)`, and Volatility3's own
# `framework.require_interface_version` REJECTS a plugin whose required major
# differs -- so a 3.x framework would refuse every plugin MemDiver emits.
#
# NAME COLLISION, worth knowing: volatility3 publishes its OWN extra called
# `full`. `memdiver[full]` and `volatility3[full]` are unrelated; MemDiver's
# `full` is a thin alias for `all`, and `all` remains the canonical name.
#
# Two costs accepted knowingly:
#   * LICENSE: volatility3 is VSL-1.0 (Volatility Software License), entering
#     the CI environment of an Apache-2.0 project. It is an optional,
#     unvendored, unmodified runtime dependency -- nothing VSL-licensed is
#     redistributed in MemDiver's wheel -- but the CI image does now contain a
#     non-Apache package.
#   * SUPPLY CHAIN: pip-audit's surface (the `security` job) grows by one
#     package plus its transitives.
vol = ["volatility3>=2.27,<3"]
# Every optional interface at once. Base already covers api + mcp + pcap, so
# this adds the Marimo notebook UI and Volatility3.
#
# `vol` is inside `all` DELIBERATELY. CI installs `-e '.[dev,all]'` (see the
# two "Install memdiver with dev + all interface extras" steps in
# .github/workflows/ci.yml), so an extra that `all` omits is an extra CI never
# installs -- and a dependency CI never installs is one that rots silently
# while every test still passes on whichever developer machine happens to have
# the package for some other project. That is precisely the failure mode
# tests/test_install_contract.py was written for; its docstring names
# yara-python as exactly that case. Keeping `vol` in `all` is what makes the
# vol3 proof harness run in CI instead of skipping there forever.
all = ["memdiver[marimo]", "memdiver[vol]"]
# Alias for `all`. Exists because `pip install "memdiver[full]"` is the command
# people type; it must resolve rather than error on an unknown extra. See the
# volatility3[full] name-collision note above.
full = ["memdiver[all]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "hypothesis"]
docs = [
    "sphinx>=7.3,<9",
    "sphinx-rtd-theme>=2.0,<4",
    "myst-parser>=3.0,<5",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx-argparse>=0.5",
    "linkify-it-py>=2.0.3",
    "cairosvg>=2.7",
    "pillow>=10.4,<12",
]

[project.urls]
Homepage = "https://github.com/MemorySlice/MemDiver"
Issues = "https://github.com/MemorySlice/MemDiver/issues"
Documentation = "https://memoryslice.github.io/MemDiver/"

[project.scripts]
memdiver = "memdiver.cli:main"

# Out-of-tree plugin discovery (added by the extensibility campaign). Built-in
# algorithms and KDFs stay filesystem-discovered; THIRD-PARTY packages can add
# their own by advertising entry points under these groups — MemDiver loads them
# in addition to the built-ins (see docs/contributing/adding_{algorithms,kdf}.md).
# For the subclass-based groups an entry point may resolve to a module (scanned
# for BaseAlgorithm/BaseKDF subclasses) or directly to a subclass:
#
#   [project.entry-points."memdiver.algorithms"]
#   my_algo = "my_pkg.detectors:MyAlgorithm"
#
#   [project.entry-points."memdiver.kdfs"]
#   my_kdf = "my_pkg.kdfs:MyKDF"
#
# The four register-call-based extension points also support out-of-tree
# discovery via these groups (see docs/contributing/adding_{dump_source,
# binary_format,pipeline_stage}.md). Here an entry point resolves to a module
# (imported for its register_* side effect) or a callable (invoked to
# self-register):
#
#   [project.entry-points."memdiver.dump_sources"]
#   my_source = "my_pkg.memdiver_source"          # module, or "...:register" callable
#
#   [project.entry-points."memdiver.formats"]
#   my_format = "my_pkg.memdiver_format"          # module, or "...:register" callable
#
#   [project.entry-points."memdiver.pipeline_stages"]
#   my_stage = "my_pkg.memdiver_stage"            # module, or "...:register" callable
#
#   [project.entry-points."memdiver.oracles"]
#   my_resource = "my_pkg.memdiver_resource"      # module, or "...:register" callable
#
# "memdiver.oracles" advertises verification resources (register_resource_type
# in engine/resources/builtin_oracle.py), selected by resource_type in an oracle
# config. An out-of-tree resource is ALWAYS loaded under the untrusted-code
# sandbox: only first-party in-tree factories get the trusted-load exemption,
# so installing a package can never buy unsandboxed execution.

[tool.setuptools]
package-dir = {"memdiver" = "."}
packages = [
    "memdiver",
    "memdiver.core",
    "memdiver.engine",
    "memdiver.presentation",
    "memdiver.algorithms",
    "memdiver.algorithms.known_key",
    "memdiver.algorithms.unknown_key",
    "memdiver.algorithms.patterns",
    "memdiver.harvester",
    "memdiver.architect",
    "memdiver.ui",
    "memdiver.ui.controls",
    "memdiver.ui.views",
    "memdiver.ui.components",
    "memdiver.core.binary_formats",
    "memdiver.core.binary_formats.kaitai_compiled",
    "memdiver.core.dump_sources",
    "memdiver.msl",
    "memdiver.app",
    "memdiver.app.pipeline",
    "memdiver.cli",
    "memdiver.mcp_server",
    "memdiver.api",
    "memdiver.api.routers",
    "memdiver.api.ws",
    "memdiver.api.services",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# The browser e2e suite (marker ``e2e``) is DESELECTED by default: pytest-playwright's
# synchronous ``page`` fixture drives Playwright on its own event loop, which cannot
# coexist in one process with the ``asyncio.run()``-based async tests (they raise
# "asyncio.run() cannot be called from a running event loop"). So the browser tests
# run in their own invocation: ``pytest -m e2e`` locally, or the dedicated ``test-e2e``
# CI job. A plain ``pytest`` shows them as "deselected" (visible, not silently skipped)
# and stays green; nothing is skipped.
# ``slow`` is deselected here too: those tests either walk the real
# machine-local corpus (~170 GB / 18,917 dumps) or run cost benchmarks, so a
# plain ``pytest`` must not pull them in. They are NOT orphaned by this: the
# ``test`` job in .github/workflows/ci.yml runs ``pytest -m slow`` as its own
# step (and ``make test-slow`` does the same locally), so the auto-floor cost
# ratchets in tests/test_benchmarks.py keep gating every push. Before this
# deselection they ran in the default sweep only by accident, because
# ``-m 'not e2e'`` never excluded ``slow``.
addopts = "--import-mode=importlib -m 'not e2e and not slow'"
testpaths = ["tests"]
markers = [
    "e2e: browser end-to-end tests (Playwright + live backend); run with `-m e2e`",
    "slow: heavy tests over real machine-local corpora (large dumps); run explicitly",
    # `requires_dataset` is NOT deselected by addopts: it is a *conditional* gate,
    # not a cost gate. tests/conftest.py skips these items when
    # tests/_paths.py::dataset_root() resolves nothing, so a developer without the
    # corpus gets clean skips and a developer WITH it gets real coverage from a
    # plain `pytest`. Only the one FULL-corpus pass carries `slow` on top; the
    # bounded slices stay in the default run on purpose -- see `make test-corpus`.
    "requires_dataset: needs the machine-local corpus (MEMDIVER_DATASET_ROOT / MEMDIVER_TLS_DUMPS_DIR / --dataset-root); auto-skips when absent",
    # `requires_vol3` is a CONDITIONAL gate, exactly like `requires_dataset`,
    # and is deliberately NOT `slow`. `slow` is a COST gate that ``addopts``
    # deselects by default, so a proof hidden behind it would never run on the
    # one machine that actually has a `vol` launcher installed -- the opposite
    # of what a conditional gate is for. tests/conftest.py skips these items
    # when engine.vol3_subproc.find_vol3_launcher() resolves nothing, so a
    # developer without Volatility3 gets a clean skip and a developer with it
    # gets the real out-of-process proof from a plain `pytest`.
    "requires_vol3: needs a real Volatility3 launcher (MEMDIVER_VOL3_BIN / vol / vol.py on PATH); auto-skips when absent",
]

# ---------------------------------------------------------------------------
# Linting / type-checking (introduced by the code-quality campaign).
#
# The repo predates linting, so the enforced gate starts as a RATCHET: the
# high-signal rule families (E/F/W/B) are selected, and the specific codes that
# already fire across the legacy tree are grandfathered in `lint.ignore` below.
# Each refactor wave burns down one or more of those codes in the area it
# touches, then deletes the code from the ignore list so it becomes enforced
# everywhere. New code is expected to be clean against the full selection.
# Mirrors the existing "baseline-locked" convention in .github/workflows/ci.yml.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
# run.py is a generated Marimo reactive notebook (cross-cell name resolution
# defeats static analysis); build/ is the stale packaging mirror.
extend-exclude = ["build", "run.py", "frontend", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# Grandfathered legacy debt — burn down per wave, then REMOVE from this list so
# the code becomes enforced everywhere (incl. new code). Codes driven to zero by
# the campaign have been removed below and are now fully enforced:
#   F821 (undefined-name), E722 (bare-except), B011 (assert-false) — count now 0.
# Remaining entries still have live legacy hits (see counts); each is a standing
# invitation to fix + un-ignore in a later pass.
ignore = [
    "E501",  # line-too-long (~595) — cosmetic reflow, low priority
    "F401",  # unused-import (~201) — re-export heavy, prune carefully per wave
    "E402",  # import-not-at-top (~29) — often intentional lazy/guarded imports
    "E702", "E701",  # multiple-statements (~50) — legacy style
    "E731",  # lambda-assignment (~16)
    "E741",  # ambiguous-var-name (4)
    "F841",  # unused-variable (9) — fix per wave
    "F541",  # f-string-no-placeholder (~25)
    "F811",  # redefined-while-unused (1)
    "B904",  # raise-without-from (~37) — improve error chaining per wave
    "B008",  # func-call-in-default (4) — mostly FastAPI Depends/Query idiom
    "B007",  # unused-loop-var (~14)
    "B905",  # zip-without-strict (~14)
    "B005",  # strip-with-multi-characters (1)
]

[tool.ruff.lint.per-file-ignores]
# __init__.py deliberately re-exports (public API); tests use asserts/fixtures.
"__init__.py" = ["F401", "F403"]
# F821 is enforced everywhere (it caught a real undefined-name bug in tests).
# E722/B011 are enforced in PRODUCTION code (0 hits there) but exempted for test
# code, which has a few pre-existing bare-excepts / `assert False` markers not
# worth churning. F841/B008 relaxations are forward-useful for fixtures/markers.
"tests/**" = ["E722", "F841", "B011", "B008"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are the sanctioned exception to B008.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.Form",
]

# mypy runs on a growing "typed island": a curated list of already-clean modules
# that each wave extends as it hardens types. This keeps the gate green today
# while giving real type coverage where refactoring concentrates. Extend `files`
# (not the whole tree) as modules are cleaned.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = false
files = [
    "core/entropy.py",
    "core/variance.py",
    "core/region_analysis.py",
    "core/region_align.py",
    "algorithms/base.py",
    # Wave 1 — new fully-typed extensibility modules.
    "core/plugin_discovery.py",
    "core/binary_formats/format_descriptor.py",
    # Wave 2 — new fully-typed performance helper.
    "engine/candidate_grid.py",
    # Wave 3 — new fully-typed service/error modules.
    "core/service_errors.py",
    "engine/consensus_service.py",
    # Wave 4 — P3.4 ratchet (2026-08).
    "core/artifact_util.py",
    "app/_progress.py",
    "core/constants.py",
    "core/classify.py",
    "core/structure_library_ssh.py",
    "core/structure_loader.py",
    "core/log.py",
    "core/alignment_filter.py",
    "core/input_schemas.py",
    "core/dump_search.py",
    "core/msl_helpers.py",
    "core/display_labels.py",
    "engine/derived_keys.py",
    "engine/results.py",
    "engine/envelope_serializer.py",
    "app/tools_fields.py",
    # Wave 5 -- Phase 2 corpus-scale modules. All written typed from the start,
    # so they join the island on arrival rather than being back-filled later.
    "core/corpus_axes.py",
    "engine/sweep_plan.py",
    "engine/truth_labels.py",
    "engine/survival_scan.py",
    "engine/detector_metrics.py",
    "engine/yara_scan.py",
    "engine/corpus_proof.py",
    "app/pipeline/corpus_pcap_runner.py",
    # The durable on-disk contract: the largest module in the change set
    # and the only one whose bugs survive the process that wrote them.
    "engine/project_db.py",
    # Wave 6 -- B0 upload-dir funnel. Typed from the start; upload_dir.py is a
    # security boundary (path validation + a privileged move), so a silent
    # Optional/str-vs-Path slip there is exactly what types are for.
    "api/upload_dir.py",
    # Same boundary, same reasoning: oracle_dir.py vets the directory the
    # server will load user-supplied Python out of, and it reuses upload_dir's
    # validator, so the two must stay type-compatible.
    "api/oracle_dir.py",
    # Wave 7 -- B1 key-location compute. New and fully typed from the start;
    # the verdict invariants are the whole point, so keep them type-checked.
    "engine/key_location.py",
    # Wave 8 -- B5.0 vol3 proof harness. Typed from the start. vol3_verify.py
    # in particular: its dataclass field NAMES are the contract
    # engine/detector_metrics.py duck-types on, so a silent Optional/int slip
    # there would zero every metric rather than raise.
    "engine/vol3_verify.py",
    "engine/vol3_subproc.py",
    # Wave 9 -- C1 protocol field model. A pure byte parser (no dpkt, no I/O)
    # written typed from the start, so it joins the island on arrival. Types
    # earn their keep here specifically: every function returns offsets that
    # index into a caller's buffer, and an Optional/int slip would produce a
    # provenance record that points at the wrong bytes -- a silently WRONG
    # answer rather than a crash. `engine/resources/tls_pcap.py` itself stays
    # outside the island (it is `Any`-typed around dpkt throughout).
    "engine/resources/protocol_fields.py",
    # Wave 10 -- C4a protocol detection. Typed from the start. It sits on the
    # FAILURE path (it explains why something else broke) and is contractually
    # forbidden to raise, so the Optional-returning sniffs and the
    # flow-key/connection-key tuple shapes are exactly what types are for: a
    # slip there would turn a diagnostic into a second exception. dpkt itself
    # stays `Any` (ignore_missing_imports), as it does for `tls_pcap.py`.
    "engine/resources/protocol_detect.py",
    # Wave 11 -- the aligned-window producer. Typed from the start, and types
    # earn their keep here for the same reason they do in protocol_fields.py:
    # every helper returns an OFFSET that a peer dump is then read at, and an
    # Optional/int slip would hand a viewer real bytes at the wrong address --
    # a silently WRONG answer rather than a crash.
    "app/tools_consensus.py",

]

# ---------------------------------------------------------------------------
# Coverage gate (P2.10). The editable install maps the `memdiver` import name
# onto the ENTIRE repo root (see [tool.setuptools] package-dir above), so a
# naive `--cov=memdiver` run counts tests/*.py, run.py, docs/, etc. as
# "source" and reports a misleading ~39% TOTAL dragged down by non-production
# files. `source` below scopes measurement to the `memdiver` package (i.e.
# the whole repo, since that's what it maps to); `omit` then excludes the
# non-production slices — the same tests/docs/scripts/tools/frontend/build
# split already used by [tool.ruff] extend-exclude and [tool.bandit]
# exclude_dirs above, plus run.py (generated Marimo notebook, exempted from
# ruff for the same reason) and conftest.py (test fixtures, not source).
# `--cov=memdiver.<submodule>` is NOT used anywhere (CI or locally): it
# double-imports numpy under some import orders and crashes. The bare `--cov`
# flag (relying on this `source` setting) is the stable form.
#
# `report.exclude_lines` deliberately keeps only the standard `pragma: no
# cover` escape — no aggressive exclusions (e.g. blanket `if TYPE_CHECKING`
# or `def __repr__` skips) that would inflate the number. The goal is an
# honest production total, not a flattering one.
#
# The CI `test` job's `--cov-fail-under` ratchet floor lives in
# .github/workflows/ci.yml (not here) so its value sits next to the pytest
# invocation it gates.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["memdiver"]
omit = [
    "tests/*",
    "*/tests/*",
    "conftest.py",
    "*/conftest.py",
    "run.py",
    "docs/*",
    "*/docs/*",
    "scripts/*",
    "*/scripts/*",
    "tools/*",
    "*/tools/*",
    "frontend/*",
    "*/frontend/*",
    "build/*",
    "*/build/*",
    "*.egg-info/*",
    "*/*.egg-info/*",
]

[tool.coverage.report]
precision = 1
skip_covered = false
exclude_lines = [
    "pragma: no cover",
]

# ---------------------------------------------------------------------------
# Security static-analysis (P2.9). Scoped to PRODUCTION code only — the same
# split used by [tool.ruff] extend-exclude above: tests/docs/scripts/tools are
# reference/dev material, frontend/ is JS (not bandit's domain), build/ is the
# stale packaging mirror, and run.py is a generated Marimo notebook (already
# exempted from ruff for the same "not real source" reason).
#
# A one-off baseline (.bandit-baseline.json — plain JSON, so this comment
# carries the notes it can't) freezes today's pre-existing findings so the CI
# `security` job only fails on NEW issues introduced going forward. Triage of
# what's in it (47 findings as frozen; the one MEDIUM was fixed by B0 and
# its stale entry is inert, so live code is now all LOW, NONE High):
#   B110/B112 (try/except/pass|continue, 23x): parser- and UI-robustness code
#     (kaitai_compiled generated parsers, ui/views navigator, format_detect
#     suggestion loop) that must tolerate malformed/partial input by design;
#     none touch msl/ crypto code.
#   B101 (assert, 10x): non-security invariant checks, not stripped-under--O
#     security gates.
#   B603/B404 (subprocess w/o shell=True + the subprocess import itself, 9x):
#     the safer subprocess pattern (no shell), flagged only because bandit
#     wants literal-arg provenance audited — this is a forensics tool that
#     legitimately shells out to gdb/lldb/memslicer/etc.
#   B607 (partial exe path, 2x): same shell-out-to-system-tool pattern
#     (core/dump_driver.py invoking "memslicer"/"lldb" by name via PATH).
#   B105 (hardcoded "password", 2x): false positive — these are enum-like
#     string literals for `secret_source` ("keylog"/"msl_hints" in
#     core/discovery.py), not actual secrets.
#   B108 (hardcoded /tmp dir): GONE as of B0. This was the baseline's only
#     MEDIUM — api/config.py's `upload_dir` default of /tmp/memdiver_uploads,
#     which api/main.py's lifespan then mkdir'd on every create_app(). Both are
#     removed: `upload_dir` is now configure-on-first-use (None until the user
#     chooses, see api/upload_dir.py + api/routers/settings.py) and the
#     directory is created 0o700 on demand. The one remaining /tmp literal is
#     in api/upload_dir.py behind `legacy_dir()`, `# nosec B108`-annotated:
#     it names the OLD directory purely so its contents can be migrated out and
#     the directory removed. The baseline is deliberately NOT regenerated — a
#     stale entry never fails `bandit -b`, and regenerating churns 452 lines —
#     so the durable guard is
#     tests/test_api_upload_dir.py::test_config_has_no_hardcoded_tmp_path.
# Regenerate after an intentional change to one of these patterns with:
#   bandit -c pyproject.toml -r . -x run.py -f json -o .bandit-baseline.json
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "docs", "scripts", "tools", "frontend", "build", "misc",
                "env", "venv", ".venv", "node_modules"]
# The four virtualenv/dependency dirs are git-ignored but bandit does not read
# .gitignore, so without them a local `make security` scans pip's vendored code
# and reports ~450 findings from site-packages -- none of them MemDiver's. A
# gate that always fails is a gate nobody reads, which is worse than no gate.
# run.py isn't a directory so exclude_dirs can't catch it; -x/--exclude in the
# CI invocation (and locally) adds it as a glob-matched path exclusion.

# tests/ is intentionally excluded from sdist/wheel — fixtures (including
# the AES sample binary and private dataset paths) must never ship.
[tool.setuptools.package-data]
memdiver = [
    "config.json",
    "algorithms/patterns/*.json",
    # The in-app documentation panel (GET /api/docs/{path}) reads these at
    # runtime, so a `pip install memdiver` that omitted them would serve the
    # panel's 404-with-published-URL fallback instead of the real page.
    "docs/**/*.md",
    # The BYO-oracle Examples tab (GET /api/oracles/examples) reads the bundled
    # templates straight off disk from docs/oracle/examples/, which holds no
    # .md at all -- so without these two globs the whole directory is absent
    # from the wheel, the registry's is_dir() check fails, and the tab renders
    # empty with a 200 for every non-repo user. The .toml matters on its own:
    # gocryptfs.toml is the config template its example oracle needs.
    "docs/**/*.py",
    "docs/**/*.toml",
    "frontend/dist/**/*",
]
