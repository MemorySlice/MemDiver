name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Force checkout/setup-node/setup-python to run their internal scripts on
  # Node 24 instead of the deprecated Node 20 runtime. See
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install memdiver with dev + all interface extras
        # `all` = marimo + vol (api/mcp/pcap are base deps again since 0.6).
        # Installing them keeps the test suite's coverage identical to pre-O-4
        # (API tests need fastapi; test_mcp_registration needs the mcp SDK;
        # marimo-gated tests would otherwise silently start skipping) AND makes
        # `vol` a dependency CI actually installs -- an extra CI never installs
        # is one that rots silently, which is the exact failure
        # tests/test_install_contract.py exists to catch. With volatility3
        # present, BOTH vol3 proofs run in CI instead of skipping there
        # forever: tests/test_vol3_verify.py in-process, and
        # tests/test_vol3_subproc.py out-of-process, because the volatility3
        # wheel installs a `vol` console script that `requires_vol3` finds on
        # PATH.
        run: python -m pip install -e '.[dev,all]'
      - name: Run pytest
        # The browser e2e files (tests/e2e_*_test.py) need Playwright + a built
        # frontend + a live server; they run in the dedicated `test-e2e` job
        # below. Everything else — including the dataset-backed tests, which now
        # self-materialise synthetic fixtures — runs here with no dataset or
        # browser setup. (test_e2e_real_dumps.py is NOT a browser test and DOES
        # run here.)
        #
        # --cov (P2.10 coverage gate): scope is set by [tool.coverage.run] in
        # pyproject.toml (production code only — tests/docs/scripts/tools/
        # frontend/build/run.py/conftest.py are omitted there), so the reported
        # TOTAL is real production coverage, not the ~39% you'd get by naively
        # counting the whole repo. Measured production total on the main branch
        # at the time this gate was added: 86.0% (local, Python 3.11, this same
        # command minus the fail-under flag). --cov-fail-under=82 sets a RATCHET
        # floor ~4 points below that — enough headroom to absorb the modules
        # that are only exercised by the separate test-crypto/test-e2e jobs
        # (this job doesn't run those), while still catching a real regression.
        # Raise this floor in a follow-up once coverage grows; do not lower it.
        run: python -m pytest -q --ignore-glob='tests/e2e_*_test.py' --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=82
      - name: Run the slow ratchets
        # `slow` is deselected by the default addopts in pyproject.toml so a
        # plain `pytest` stays fast, but tests/test_benchmarks.py's auto-floor
        # cost ceilings are RATCHETS (they pin the per-candidate memory and
        # time numbers three optimisations were justified by) and must still
        # run somewhere. Before the addopts change they rode along in the run
        # above by accident, because `-m 'not e2e'` never deselected `slow`.
        # The corpus-backed slow tests (tests/test_pcap_oracle_real_dump.py)
        # self-skip here: they are gated on a machine-local dump tree that no
        # CI runner has.
        run: python -m pytest -q -m slow
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml

  # Python lint + type gate, introduced by the code-quality campaign. Runs on
  # the ratchet config in pyproject.toml: ruff enforces E/F/W/B (legacy codes
  # grandfathered there and burned down per refactor wave); mypy runs on the
  # curated "typed island" ([tool.mypy] files). Kept a separate lean job (only
  # ruff+mypy, no package install) so a style regression can't mask test
  # failures and vice-versa. `ruff format --check` is advisory for now (the
  # legacy tree is not yet reformatted), mirroring the frontend hex-literal
  # advisory convention below.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install lint/type tooling
        run: python -m pip install ruff mypy
      - name: Ruff lint (enforced)
        run: ruff check .
      - name: Ruff format check (advisory)
        continue-on-error: true
        run: ruff format --check .
      - name: mypy (typed-island scope)
        run: mypy

  # Dependency + static security scanning (P2.9). Kept a separate lean job
  # (like `lint`/`test-crypto`/`test-e2e`) so a scan finding can't mask test
  # failures and vice-versa.
  #   - bandit: static analysis over PRODUCTION code only (scope defined by
  #     [tool.bandit] in pyproject.toml). Gated against .bandit-baseline.json
  #     so only NEW findings fail the job — the ~47 pre-existing LOW/MEDIUM
  #     findings (acceptable-by-design: parser/UI robustness try/except,
  #     shelling out to gdb/lldb/memslicer by name, etc. — see the
  #     [tool.bandit] comment in pyproject.toml for the full triage) are
  #     frozen in the baseline rather than reformatted to please the scanner.
  #   - pip-audit: audits the SAME editable install the `test` job uses.
  #     `pip install --upgrade pip setuptools` first — an unpatched
  #     ambient/bootstrap setuptools is otherwise the #1 source of noise here
  #     (PYSEC-2022-43012 et al. against the venv's own setuptools, unrelated
  #     to any memdiver dependency). No advisories are ignored: at the time
  #     this job was added, a clean env has zero known vulnerabilities.
  #   - npm audit (both frontend/ and tests/e2e/): advisory-only
  #     (`continue-on-error: true`), mirroring the `ruff format --check`
  #     advisory convention in `lint` above. Transitive frontend build-tool
  #     deps (vite/react-router/etc.) routinely trip `--audit-level=high`
  #     well before a real, actionable MemDiver-side fix exists; Dependabot
  #     (.github/dependabot.yml) is the mechanism that actually clears these.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install memdiver with dev + all interface extras
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e '.[dev,all]'
      - name: Install security scanning tools
        run: python -m pip install bandit pip-audit
      - name: bandit (production code, baseline-gated)
        run: bandit -c pyproject.toml -r . -x run.py -b .bandit-baseline.json
      - name: pip-audit (installed dependency tree)
        run: pip-audit
      # ONE hoisted install covering both npm workspaces (frontend +
      # tests/e2e), against the single root package-lock.json. The audit now
      # sees the deduped tree, so a shared transitive is reported once rather
      # than twice.
      - name: Install JS deps (root workspace install)
        run: npm ci
      - name: npm audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Proves the built WHEEL installs into a clean environment and the
  # `memdiver.*` namespace resolves WITHOUT the repo root on sys.path. The
  # `test` job above installs editable and runs under pyproject's
  # pythonpath=["."], so it cannot catch packaging/namespace regressions
  # (e.g. a subpackage missing from the wheel, or a bare `from core.` import).
  # Since O-4 the smoke runs in TWO stages: first a BARE install to prove the
  # lean library core imports on its own (and that the web/MCP/UI deps are
  # genuinely absent), then an `[api,mcp]` install to exercise create_app() +
  # the FastMCP server that those extras unlock.
  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Build the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
      - name: Install the BARE wheel into a clean venv (base deps only)
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install --upgrade pip
          /tmp/wheelenv/bin/python -m pip install dist/*.whl
      # Run from /tmp so the checked-out repo root is NOT on sys.path — imports
      # must resolve from the installed package in site-packages.
      - name: Lean-core smoke from the installed wheel (no extras)
        working-directory: /tmp
        run: |
          /tmp/wheelenv/bin/python -c "import memdiver; assert 'site-packages' in memdiver.__file__, memdiver.__file__; print('memdiver', memdiver.__version__, memdiver.__file__)"
          /tmp/wheelenv/bin/python -c "import memdiver.msl.importer, memdiver.core.dump_sources.gcore, memdiver.core.dump_sources.gdb_raw, memdiver.core.dump_sources.lldb_raw, memdiver.core.binary_formats.minidump_reader; print('deep + dump_sources imports ok')"
          /tmp/wheelenv/bin/python -c "import memdiver; [getattr(memdiver, n) for n in memdiver.__all__]; print('public API symbols ok:', len(memdiver.__all__))"
          # FULL-BY-DEFAULT guarantee (reverses the old O-4 lean-core assertion):
          # `pip install memdiver` must ship every interface AND the dump-collection
          # and post-quantum stacks. The two OPT-IN extras must still be absent:
          # marimo (~164 MB, more than four times every other interface
          # combined) and volatility3 (the `vol` extra -- VSL-1.0, and only
          # needed to RUN an emitted plugin, not to emit one).
          #
          # find_spec, NOT __import__, on purpose: importing `oqs` makes
          # liboqs-python cmake-BUILD the liboqs C library into ~/_oqs, which
          # would turn this assertion into a multi-minute native build.
          /tmp/wheelenv/bin/python -c "
          import importlib.util as u
          need = ('fastapi', 'uvicorn', 'mcp', 'dpkt', 'multipart', 'frida', 'frida_tools', 'memslicer', 'oqs')
          missing = [m for m in need if u.find_spec(m) is None]
          assert not missing, ('default install is missing: ' + repr(missing))
          assert u.find_spec('marimo') is None, 'marimo must stay an opt-in extra'
          assert u.find_spec('volatility3') is None, 'volatility3 must stay an opt-in extra'
          print('full default install ok:', len(need), 'stacks present, marimo + volatility3 absent')
          "
      - name: CLI entrypoint smoke (core)
        run: /tmp/wheelenv/bin/memdiver --help > /dev/null && echo "memdiver CLI entrypoint ok"
      # The web app must BUILD from the BARE wheel, not merely import. This is
      # the python-multipart regression guard: the four UploadFile/Form routers
      # (dumps, consensus, oracles, pcaps) make FastAPI raise at ROUTER IMPORT
      # time, so a missing python-multipart kills `memdiver web` at startup
      # rather than on first upload. It must run in the bare venv -- mcp and
      # marimo both pull python-multipart transitively and would mask it.
      - name: Default-install smoke -- the web app must BUILD, not just import
        working-directory: /tmp
        run: |
          /tmp/wheelenv/bin/python -c "
          import memdiver.api.main as m
          app = m.create_app()   # raises if python-multipart is missing
          print('default-install app builds ok:', len(app.routes), 'routes')
          "
      # api/mcp/pcap are now empty BACK-COMPAT ALIASES (their deps moved into
      # the base install). Installing through them must still resolve, so that
      # existing READMEs / Dockerfiles / requirements.txt pinning
      # `memdiver[api]` keep working rather than erroring on an unknown extra.
      - name: Back-compat -- the no-op aliases must still resolve
        run: |
          WHEEL=$(ls dist/*.whl)
          /tmp/wheelenv/bin/python -m pip install "${WHEEL}[api,mcp,pcap,experiment,crypto]"
      - name: API + MCP smoke (with extras)
        working-directory: /tmp
        run: |
          /tmp/wheelenv/bin/python -c "import memdiver.api.main as m; print('api routes:', len(m.create_app().routes))"
          /tmp/wheelenv/bin/python -c "
          from memdiver.mcp_server.server import create_server
          s = create_server()
          mgr = getattr(s, '_tool_manager', None)
          if mgr is not None and callable(getattr(mgr, 'list_tools', None)):
              names = {t.name for t in mgr.list_tools()}
          elif isinstance(getattr(mgr, '_tools', None), dict):
              names = set(mgr._tools)
          else:
              names = set(getattr(s, '_tools', {}) or {})
          need = {'get_processes', 'get_modules', 'get_handles'}
          assert need <= names, ('missing granular inspect tools', sorted(names))
          assert len(names) >= 26, ('expected >= 26 tools, got', len(names), sorted(names))
          print('mcp FastMCP server builds ok:', len(names), 'tools incl', sorted(need))
          "
      # The `vol` extra must install AND the `full` alias must resolve. Both
      # halves matter: `vol` is what engine/vol3_verify.py probes at module
      # level (so tests/test_install_contract.py requires it to be declared),
      # and `full` exists only so `pip install "memdiver[full]"` -- the command
      # people actually type -- resolves instead of erroring on an unknown
      # extra. Note volatility3 publishes its OWN `full` extra; the two are
      # unrelated and `all` stays canonical.
      #
      # `full` is checked with --dry-run on purpose: resolving it for real would
      # pull marimo's ~164 MB, which the bare-wheel assertion above deliberately
      # keeps out of this venv. A dry run proves the ALIAS resolves without
      # paying for the download or perturbing the installed set.
      - name: Volatility3 extra -- "[vol]" installs, "[full]" alias resolves
        run: |
          WHEEL=$(ls "$PWD"/dist/*.whl)
          /tmp/wheelenv/bin/python -m pip install "${WHEEL}[vol]"
          # Subshell, so the `cd` cannot leak into the commands after it; WHEEL
          # is absolute for the same reason.
          (cd /tmp && /tmp/wheelenv/bin/python -c "
          from volatility3.framework import constants as c
          print('volatility3 framework:', c.VERSION_MAJOR, c.VERSION_MINOR, c.VERSION_PATCH)
          assert (c.VERSION_MAJOR, c.VERSION_MINOR) >= (2, 27), 'the vol extra floors at 2.27'
          assert c.VERSION_MAJOR < 3, 'emitted plugins declare framework major 2'
          ")
          /tmp/wheelenv/bin/python -m pip install --dry-run "${WHEEL}[full]" | tee /tmp/full-dryrun.txt
          grep -qi marimo /tmp/full-dryrun.txt || {
            echo 'ERROR: memdiver[full] did not resolve through all -> marimo'; exit 1; }
          echo 'memdiver[full] alias resolves (marimo seen in the dry run, not downloaded)'

  # Exercises the post-quantum KEM paths (ML-KEM / hybrid) which are gated
  # behind the optional [crypto] extra and skipped in the main `test` job.
  # liboqs-python builds the native liboqs C library via CMake at install
  # time, so cmake/ninja are required. Kept separate so a liboqs build
  # break can't mask core test failures.
  test-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install liboqs build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Install memdiver with dev + crypto extras
        run: python -m pip install -e '.[dev,crypto]'
      - name: Run post-quantum KEM tests
        run: python -m pytest -q tests/test_msl_crypto.py tests/test_msl_encryption.py

  # Browser e2e (tests/e2e_*_test.py). Excluded from the main `test` job
  # because they need Playwright + a built frontend + a live backend. The
  # `live_backend` conftest fixture auto-starts uvicorn on 127.0.0.1:8080;
  # the dataset-backed dumps they load are the synthetic fixtures materialised
  # at pytest_configure (no private dataset required). Kept a separate job so a
  # browser flake can't mask core test failures (mirrors `test-crypto`/`a11y`).
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install memdiver + Playwright (Python)
        run: |
          python -m pip install -e '.[dev,all]'
          python -m pip install playwright pytest-playwright
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build the frontend (served by the live backend)
        run: |
          npm ci
          npm run build -w frontend
      - name: Run browser e2e tests
        # `-m e2e` overrides the default `-m 'not e2e'` in pyproject addopts
        # (the browser suite is deselected everywhere else because Playwright's
        # sync loop can't share a process with the async unit tests).
        run: |
          python -m pytest -q -m e2e \
            tests/e2e_fixes_test.py \
            tests/e2e_session_cycle_test.py \
            tests/e2e_session_features_test.py \
            tests/e2e_workspace_issues_test.py

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install JS deps (root workspace install)
        run: npm ci
      # Guard against the #1 post-migration footgun: `npm install` inside a
      # workspace regenerates a nested node_modules with a SECOND copy of react.
      # The app symptom is "Invalid hook call"; the vitest/eslint symptom is two
      # module instances and inexplicable identity failures. Note we assert on
      # the identity-sensitive packages, NOT on "zero nested node_modules" --
      # npm legitimately nests a build plugin now and then.
      - name: Assert one hoisted copy of react
        run: |
          set -euo pipefail
          for pkg in react react-dom; do
            n=$(find . -type d -path "*/node_modules/$pkg" \
                  -not -path '*/node_modules/*/node_modules/*' \
                  -not -path './.git/*' | wc -l)
            test "$n" -eq 1 || { echo "::error::expected 1 copy of $pkg, found $n (run \`npm ci\` at the repo ROOT)"; exit 1; }
          done
      - name: Typecheck
        # Must be `tsc -b`: frontend/tsconfig.json is references-only with
        # `files: []`, so plain `tsc --noEmit` compiles zero files and always
        # passes. `-b` walks the project references -- app, node, and TEST, the
        # last of which is the only thing typechecking <repo>/tests/frontend/
        # now that the suite lives outside the app program.
        run: npx tsc -b frontend
      - name: Unit tests (vitest)
        run: npm run test:run
      - name: eslint (advisory)
        run: npm run lint
        continue-on-error: true
      - name: Colour-literal lint (baseline-locked)
        run: node scripts/check-no-tailwind-colour-literals.mjs
      # Hex-literal lint remains advisory-only for now (49 pre-existing
      # offenders, no baseline-lock). Wire it into CI once either
      # (a) those offenders are migrated, or (b) the script grows a
      # baseline-lock mode matching the colour-literal check.

  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'tests/frontend/**'
              - 'tests/e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.mjs'
              - '.github/workflows/ci.yml'

  a11y:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install memdiver
        # a11y specs drive the live FastAPI backend, so the `api` extra
        # (fastapi/uvicorn) is required now that it is no longer a base dep.
        run: python -m pip install -e '.[dev,api]'
      - name: Install JS deps (root workspace install -- frontend + tests/e2e)
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run a11y specs (baseline assertion)
        working-directory: tests/e2e
        env:
          BACKEND_PORT: '8091'
          FRONTEND_PORT: '5191'
        run: npx playwright test specs/a11y- --reporter=line
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-playwright-report
          path: tests/e2e/playwright-report/
