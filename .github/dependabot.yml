version: 2
updates:
  # Python production + dev dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # React/Vite frontend (frontend/) + Playwright e2e/a11y suite (tests/e2e/).
  # Both are npm WORKSPACES of the root package.json: one hoisted node_modules,
  # one package-lock.json. Dependabot reads `workspaces` from the root manifest
  # and updates the child package.json files plus the single root lockfile, so
  # one `directory: "/"` entry replaces the two per-package entries this used to
  # need. Do NOT re-add /frontend or /tests/e2e entries -- with no lockfile of
  # their own they would either no-op or open PRs that resurrect one.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions pinned in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
